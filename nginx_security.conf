# ============================================================
# Fotocopiadora SyP — Nginx Security Snippet
# ============================================================

# Bloquear acceso a archivos y directorios ocultos (.git, etc.)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
    return 404;
}

# Bloquear acceso directo a bases de datos y código de backend
location ~* \.(db|sqlite|sqlite3|py|env|md|jsonl|log|bak|tmp)$ {
    deny all;
    return 404;
}

# Bloquear carpetas internas
location ^~ /fastapi_backend {
    deny all;
    return 404;
}

location ^~ /backend {
    deny all;
    return 404;
}
